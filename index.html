<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A minimal personal feed of public LinkedIn posts and keyword discoveries.">
  <title>My RSS Feed</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fafafa}
    *{box-sizing:border-box}body{margin:0}.wrap{width:min(820px,calc(100% - 32px));margin:0 auto;padding:48px 0 80px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.02em}header a{font-size:13px;color:#666;text-decoration:none}header a:hover{text-decoration:underline}
    #status{font-size:13px;color:#777;margin:0 0 20px}.item{padding:20px 0;border-top:1px solid #e8e8e8}.item:last-child{border-bottom:1px solid #e8e8e8}
    .meta{font-size:12px;color:#888;margin-bottom:8px}.title{font-size:17px;line-height:1.4;margin:0 0 8px;font-weight:600}.desc{font-size:14px;line-height:1.6;color:#555;white-space:pre-wrap;margin:0 0 14px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;padding:7px 11px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#333;text-decoration:none;font-size:12px}.btn:hover{background:#f3f3f3}.primary{border-color:#222;background:#222;color:#fff}.primary:hover{background:#333}
    .empty{padding:48px 0;color:#777;font-size:14px}.error{color:#a33}.source{font-weight:500;color:#666}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>My RSS Feed</h1>
      <a href="feed.xml">RSS</a>
    </header>
    <p id="status">Loading latest items…</p>
    <section id="feed" aria-live="polite"></section>
  </main>
  <script>
    const feedUrl='feed.xml';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const text=(node,name)=>node?.querySelector(name)?.textContent?.trim()||'';
    const chatUrl=(title,description,link)=>'https://chatgpt.com/?q='+encodeURIComponent(`Give me a concise gist of this post/news. Use the original source as the reference.\n\nTitle: ${title}\n\nContent: ${description}\n\nOriginal source: ${link}`);
    async function load(){
      const status=document.getElementById('status'), target=document.getElementById('feed');
      try{
        const xml=await fetch(feedUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.text()});
        const doc=new DOMParser().parseFromString(xml,'application/xml');
        if(doc.querySelector('parsererror'))throw Error('Invalid RSS');
        const items=[...doc.querySelectorAll('channel > item')];
        status.textContent=items.length?`${items.length} latest items`:'No items yet';
        target.innerHTML=items.map(item=>{
          const title=text(item,'title')||'Untitled';
          const link=text(item,'link');
          const description=text(item,'description');
          const date=text(item,'pubDate');
          const source=link?new URL(link).hostname.replace(/^www\./,''):'';
          return `<article class="item"><div class="meta">${esc(date)}${source?` · <span class="source">${esc(source)}</span>`:''}</div><h2 class="title">${esc(title)}</h2>${description?`<p class="desc">${esc(description)}</p>`:''}<div class="actions"><a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open original ↗</a><a class="btn primary" href="${esc(chatUrl(title,description,link))}" target="_blank" rel="noopener noreferrer">Get gist in ChatGPT →</a></div></article>`;
        }).join('')||'<div class="empty">Nothing has been collected yet. Add LinkedIn profiles or keywords to <code>config.json</code>.</div>';
      }catch(e){status.innerHTML='<span class="error">Could not load the feed.</span>';target.innerHTML='<div class="empty">The RSS feed may not have been generated yet.</div>';console.error(e)}
    }
    load();
  </script>
</body>
</html>
